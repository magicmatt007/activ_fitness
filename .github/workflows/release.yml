name: "Release"

on:
  release:
    types:
      - "published"

permissions: {}

jobs:
  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - name: "Checkout the repository"
        uses: "actions/checkout@v4.1.5"

      - name: "Adjust version number"
        shell: "bash"
        env:
          TAG: "${{ github.event.release.tag_name }}"
        run: |
          # Tags look like "v0.4.1"; the manifest version has no "v".
          VERSION="${TAG#v}" yq -i -o json '.version = strenv(VERSION)' \
            "${{ github.workspace }}/custom_components/activ_fitness/manifest.json"

      - name: "ZIP the integration directory"
        shell: "bash"
        run: |
          cd "${{ github.workspace }}/custom_components/activ_fitness"
          zip activ_fitness.zip -r ./

      - name: "Upload the ZIP file to the release"
        uses: softprops/action-gh-release@v0.1.15
        with:
          files: ${{ github.workspace }}/custom_components/activ_fitness/activ_fitness.zip
